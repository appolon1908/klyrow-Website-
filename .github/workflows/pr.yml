name: PR checks
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'refactor/**'
      - 'perf/**'
      - 'release/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Enforce Klyrow design system
        run: pnpm test:design
        env:
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DESIGN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm test
      - run: pnpm build
      - run: pnpm unused
      - run: pnpm scan:dependencies
      - run: pnpm scan:secrets
